<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>相机素材导出</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel-2:#1b202a; --line:#232936;
    --text:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --accent-2:#6ea8ff;
    --ok:#35c07f; --warn:#f2b544; --err:#ff5c5c; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh;
    user-select:none;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:16px 20px 12px;
  }
  .logo{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-left:2px}
  header .spacer{flex:1}
  .pill{
    display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;
    max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .pill.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .pill.busy .dot{background:var(--warn);animation:pulse 1.1s infinite}
  .pill.err .dot{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .bar{display:flex;gap:10px;align-items:center;padding:0 20px 12px;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:4px 6px 4px 10px;height:34px}
  .field label{color:var(--muted);font-size:12px}
  .field input{background:transparent;border:0;color:var(--text);font:inherit;width:120px;outline:none}
  .field input.port{width:64px}
  button{
    height:34px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font:inherit;cursor:pointer;transition:.15s;
  }
  button:hover:not(:disabled){border-color:#33405a;background:#202634}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
  button.ghost{background:transparent}
  button.danger{color:var(--err);border-color:#3a2730}

  .toolbar{display:flex;align-items:center;gap:12px;padding:0 20px 10px;flex-wrap:wrap}
  .check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer}
  input[type=checkbox]{
    width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;
  }
  .path{color:var(--muted);font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow{flex:1}

  main{flex:1;min-height:0;margin:0 20px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  thead th{
    position:sticky;top:0;background:#141922;color:var(--muted);font-weight:500;font-size:12px;
    text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);z-index:1;
  }
  th.c,td.c{width:44px;text-align:center}
  th.s,td.s{width:96px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  th.st,td.st{width:80px;color:var(--muted)}
  tbody td{padding:9px 12px;border-bottom:1px solid #1c222d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#1a202b}
  tbody tr.on{background:#182031}
  .empty{padding:56px 20px;text-align:center;color:var(--muted);line-height:1.9}
  .empty b{color:var(--text);font-weight:500}

  footer{padding:12px 20px 16px}
  .progress-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}
  .progress-card.show{display:block}
  .row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .row .name{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
  .track{height:6px;background:#0c0f14;border-radius:999px;margin-top:10px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7bb3ff);transition:width .2s}
  .stats{font-variant-numeric:tabular-nums}

  .logbox{margin-top:10px}
  .logbox summary{cursor:pointer;color:var(--muted);font-size:12px;outline:none}
  pre{
    margin:8px 0 0;max-height:180px;overflow:auto;background:#0c0f14;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;color:#9aa4b8;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    user-select:text;
  }
</style>
</head>
<body>
<header>
  <span class="logo"></span>
  <h1>相机素材导出</h1>
  <span class="sub">Wi-Fi 直连 · 不经过官方 App</span>
  <span class="spacer"></span>
  <div id="pill" class="pill"><span class="dot"></span><span id="pillText">未连接</span></div>
</header>

<div class="bar">
  <div class="field">
    <label>相机</label>
    <input id="ip" value="192.168.2.1" spellcheck="false">
    <label>端口</label>
    <input id="port" class="port" value="9004" spellcheck="false">
  </div>
  <button id="btnConnect" class="primary">连接</button>
  <button id="btnRefresh" class="ghost" disabled>刷新列表</button>
  <span id="device" class="sub"></span>
</div>

<div class="toolbar">
  <label class="check"><input type="checkbox" id="selAll">全选</label>
  <span id="count" class="sub">已选 0 个</span>
  <span class="grow"></span>
  <span class="path" id="outdir"></span>
  <button id="btnDir" class="ghost">选择目录</button>
  <button id="btnOpenDir" class="ghost">打开</button>
  <button id="btnDownload" class="primary" disabled>下载</button>
  <button id="btnCancel" class="danger" style="display:none">取消</button>
</div>

<main>
  <table>
    <thead>
      <tr>
        <th class="c"></th>
        <th>文件名</th>
        <th class="s">大小</th>
        <th class="st">存储</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty">
    还没有连接相机<br>
    <b>1.</b> 相机打开「无线连接」，频段选 2.4G　<b>2.</b> 电脑连上相机热点　<b>3.</b> 点「连接」
  </div>
</main>

<footer>
  <div id="pcard" class="progress-card">
    <div class="row">
      <span class="name" id="pName">—</span>
      <span class="grow"></span>
      <span class="stats" id="pStats"></span>
    </div>
    <div class="track"><div class="fill" id="pFill"></div></div>
  </div>
  <details class="logbox">
    <summary>运行日志</summary>
    <pre id="log"></pre>
  </details>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const selected = new Set();
let outdir = "";
let files = [];
let sig = "";
let logAuto = true;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function fmtSize(n){
  if (!n && n !== 0) return "—";
  if (n < 1024) return n + " B";
  const u = ["KB","MB","GB"]; let i = -1; let v = n;
  do { v /= 1024; i++; } while (v >= 1024 && i < 2);
  return v.toFixed(v >= 100 ? 0 : 1) + " " + u[i];
}
function fmtSpeed(bps){ return bps > 0 ? (bps/1048576).toFixed(2) + " MB/s" : "—"; }
function fmtEta(done,total,speed){
  if (!total || speed <= 0 || done >= total) return "";
  const s = Math.max(0, Math.round((total-done)/speed));
  return s > 3600 ? Math.floor(s/3600)+"h "+(Math.floor(s/60)%60)+"m" : Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

async function call(name, ...args){
  try { return await window.pywebview.api[name](...args); }
  catch (e) { console.error(name, e); return null; }
}

function render(s){
  const busy = ["connecting","listing","downloading"].includes(s.phase);
  const pill = $("pill");
  pill.className = "pill" + (s.phase === "error" ? " err" : busy ? " busy" : s.connected ? " ok" : "");
  $("pillText").textContent = s.message || "未连接";
  $("device").textContent = s.device ? s.device.replace(/\s*\|\s*/g, " · ") : "";
  $("btnConnect").textContent = s.connected ? "重新连接" : "连接";
  $("btnConnect").disabled = busy;
  $("btnRefresh").disabled = busy || !s.connected;
  $("btnDir").disabled = busy;
  $("btnOpenDir").disabled = !s.outdir;
  $("btnDownload").disabled = busy || !s.connected || selected.size === 0;
  $("btnCancel").style.display = s.phase === "downloading" ? "" : "none";

  if (s.outdir && s.outdir !== outdir){ outdir = s.outdir; $("outdir").textContent = outdir; $("outdir").title = outdir; }

  const nsig = s.files.map(f => f.path + ":" + f.size).join("|");
  if (nsig !== sig){
    sig = nsig;
    files = s.files || [];
    const alive = new Set(files.map(f => f.path));
    [...selected].forEach(p => { if (!alive.has(p)) selected.delete(p); });
    renderRows();
  } else {
    files = s.files || [];
  }
  $("empty").style.display = files.length ? "none" : "block";
  $("count").textContent = "已选 " + selected.size + " 个" + (files.length ? " · 共 " + files.length + " 个" : "");

  const p = s.progress || {};
  const show = s.phase === "downloading" && p.name;
  $("pcard").classList.toggle("show", !!show);
  if (show){
    const pct = p.total ? Math.min(100, p.done * 100 / p.total) : 0;
    $("pName").textContent = p.index + "/" + p.count + " · " + p.name;
    $("pFill").style.width = pct.toFixed(1) + "%";
    $("pStats").textContent = fmtSize(p.done) + (p.total ? " / " + fmtSize(p.total) : "") +
      "　" + fmtSpeed(p.speed) + (fmtEta(p.done,p.total,p.speed) ? "　剩余 " + fmtEta(p.done,p.total,p.speed) : "");
  }

  const log = $("log");
  const text = (s.log || []).join("\n");
  if (log.textContent !== text){
    const near = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
    log.textContent = text;
    if (near) log.scrollTop = log.scrollHeight;
  }
}

function renderRows(){
  const tb = $("rows");
  tb.innerHTML = files.map(f => {
    const on = selected.has(f.path);
    return "<tr class=\"" + (on ? "on" : "") + "\" data-path=\"" + esc(f.path) + "\">" +
      "<td class=\"c\"><input type=\"checkbox\" " + (on ? "checked" : "") + "></td>" +
      "<td title=\"" + esc(f.name) + "\">" + esc(f.name) + "</td>" +
      "<td class=\"s\">" + (f.size > 0 ? fmtSize(f.size) : "—") + "</td>" +
      "<td class=\"st\">" + (f.store === 0 ? "SD" : "内部") + "</td></tr>";
  }).join("");
  $("selAll").checked = files.length > 0 && selected.size === files.length;
}

$("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr");
  if (!tr) return;
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TD") return;
  const path = tr.dataset.path;
  if (e.target.tagName === "INPUT"){
    e.target.checked ? selected.add(path) : selected.delete(path);
  } else {
    selected.has(path) ? selected.delete(path) : selected.add(path);
  }
  renderRows();
  $("count").textContent = "已选 " + selected.size + " 个 · 共 " + files.length + " 个";
  $("btnDownload").disabled = selected.size === 0;
});

$("selAll").addEventListener("change", (e) => {
  selected.clear();
  if (e.target.checked) files.forEach(f => selected.add(f.path));
  renderRows();
  $("btnDownload").disabled = selected.size === 0;
  $("count").textContent = "已选 " + selected.size + " 个 · 共 " + files.length + " 个";
});

$("btnConnect").addEventListener("click", () => call("connect", $("ip").value.trim(), Number($("port").value) || 9004));
$("btnRefresh").addEventListener("click", () => call("refresh"));
$("btnDownload").addEventListener("click", () => {
  const idx = files.filter(f => selected.has(f.path)).map(f => f.idx);
  call("download", idx, outdir);
});
$("btnCancel").addEventListener("click", () => call("cancel"));
$("btnDir").addEventListener("click", async () => {
  const p = await call("choose_dir");
  if (p){ outdir = p; $("outdir").textContent = p; $("outdir").title = p; }
});
$("btnOpenDir").addEventListener("click", () => call("open_dir", outdir));

async function tick(){
  if (!window.pywebview || !window.pywebview.api) return;
  const s = await call("state");
  if (s) render(s);
}

window.addEventListener("pywebviewready", () => {
  tick();
  setInterval(tick, 400);
});
</script>
</body>
</html>
